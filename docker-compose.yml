version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: orim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orim
      POSTGRES_PASSWORD: orim_secret
      POSTGRES_DB: orim
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orim -d orim"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orim-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: orim-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: orim
      MINIO_ROOT_PASSWORD: orim_secret_key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    name: orim-network
